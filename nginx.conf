# Runs as non-root (nginx-unprivileged) behind the Cloudflare tunnel; TLS ends at Cloudflare.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/xml application/json image/svg+xml
               application/octet-stream text/plain;

    # A static site only ever needs GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # add_header does not inherit into locations that set their own, so every location includes this.
    include /etc/nginx/snippets/security-headers.conf;

    location ~ /\. { return 404; }

    # Content-hashed bundles never change.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(woff2|jpg|jpeg|png|webp|svg|bin)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
